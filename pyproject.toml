[project]
name = "django-mongo-backend"
version = "0.29"
description = ""
authors = [
    { name = "gersmann" },
    { name = "parcellab" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["django", "mongodb", "backend"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "dictlib>=1.1",
    "pymongo>=4.11",
]

[project.urls]
Homepage = "https://github.com/parcellab/django-mongo-backend"
Repository = "https://github.com/parcellab/django-mongo-backend"

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.1",
    "django-jsonform>=2.23",
    "pytest>=8.3",
    "pytest-django==4.10.0",
    "ruff>=0.11",
    "pre-commit>=4.2",
    "django-mongodb-backend>=5.2.0b1",
]
dev-django = [
    "python-dotenv>=1.1",
    "django-jsonform>=2.23",
    "pytest>=8.3",
    "pytest-django==4.10.0",
    "ruff>=0.11",
    "pre-commit>=4.2",
    "django>=5.2,<5.3",  # Default to Django 5.2
    "django-mongodb-backend>=5.2.0b1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
DJANGO_SETTINGS_MODULE = "testproject.settings"
testpaths = ["test"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.ruff]
line-length = 100
target-version = 'py311'
exclude = ["migrations"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "C",  # flake8-comprehensions
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]
ignore = [
  "E501", # line length handled by format
  "C408", # dict vs dict literal
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["django_mongodb"]

[tool.hatch.build.targets.wheel]
packages = ["django_mongodb"]

[tool.tox]
env_list = ["django51", "django52", "django5"]

[tool.tox.env_run_base]
runner = "virtualenv"
description = "Run test under {base_python}"
skip_install = true
passenv = ["DJANGO_SETTINGS_MODULE", "MONGODB_URL", "MONGODB_PORT", "PYTEST_ADDOPTS", "CI"]
allowlist_externals = ["uv", "pytest"]
commands = [["pytest", "-x", "-vvv", "--capture=no"]]

[tool.tox.env.django5]
commands_pre = [
  ["uv", "pip", "install", "--editable", ".[dev]"],
  ["uv", "pip", "install", "django>=5,<5.1"],
]

[tool.tox.env.django51]
commands_pre = [
  ["uv", "pip", "install", "--editable", ".[dev]"],
  ["uv", "pip", "install", "django>=5.1,<5.2"],
]

[tool.tox.env.django52]
commands_pre = [
  ["uv", "pip", "install", "--editable", ".[dev-django]"],
]

[tool.tox.gh.python]
"3.13" = ["django51", "django52", "django5"]
"3.12" = ["django51", "django52", "django5"]
